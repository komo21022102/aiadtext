<!DOCTYPE html>
<html lang='zh-Hant'>
<head>
<meta charset='UTF-8'>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>左右大腦對決 AI 實戰教育訓練</title>
<meta name="description" content="兩週 AI 實戰教育訓練：從題目到上線，封裝成可重複使用的 SKILL 工具。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#4A90E2;--text:#1A1A2E;--light:#F8F9FB;--border:#E0E0E0;}
*{box-sizing:border-box;}
body{margin:0;padding:0;background:var(--light);color:var(--text);font-family:Inter,sans-serif;}
.hero{background:var(--light);padding:100px 24px;text-align:center;}
.hero h1{font-size:2.8rem;margin:0 0 20px;color:var(--text);}
.hero h1 strong{color:var(--blue);}
.hero p{font-size:1.05rem;color:#666;margin:0 0 40px;max-width:600px;margin-left:auto;margin-right:auto;}
.btn{display:inline-block;padding:11px 28px;background:var(--blue);color:#fff;text-decoration:none;border-radius:6px;font-weight:600;transition:0.3s;}
.btn:hover{background:#2E5DC8;transform:translateY(-2px);}
.container{max-width:1000px;margin:0 auto;padding:60px 24px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin:40px 0;}
.card{background:#fff;padding:40px;border:2px solid var(--border);border-radius:12px;transition:0.3s;}
.card:hover{border-color:var(--blue);box-shadow:0 8px 24px rgba(74,144,226,0.15);}
.card h3{color:var(--blue);margin:0 0 12px;font-size:1.2rem;}
.card ul{margin:16px 0;padding-left:20px;color:#666;font-size:0.95rem;}
.card a{display:block;margin-top:20px;}
footer{text-align:center;padding:40px 24px;color:#888;font-size:0.9rem;border-top:1px solid var(--border);}
</style>
</head>
<body>
<section class="hero">
<h1>左右大腦對決 <strong>AI 實戰教育訓練</strong></h1>
<p>兩種設計風格任你選擇 — 現代配色版 vs 極簡藍調版</p>
<a href="#designs" class="btn">查看設計版本</a>
</section>

<div class="container">
<h2 style="text-align:center;font-size:1.8rem;margin:60px 0 40px;">選擇你的設計風格</h2>

<div class="grid" id="designs">
<div class="card">
<h3>🎨 現代色彩版 (Master)</h3>
<p>黃色 Hero、彩色卡片、視覺豐富。靈感來自 flox.dev。</p>
<ul>
<li>黃色梯度背景</li>
<li>彩色統計卡片</li>
<li>視覺層級豐富</li>
<li>品牌突出</li>
</ul>
<a href="AI教育訓練_左右大腦對決_作業_v2.html" class="btn">查看現代色彩版</a>
</div>

<div class="card">
<h3>✨ 極簡藍調版 (Genie)</h3>
<p>簡潔白色、藍色主題、優雅設計。靈感來自 Genie。</p>
<ul>
<li>純白背景</li>
<li>藍色主色調</li>
<li>聚焦內容</li>
<li>專業簡約</li>
</ul>
<a href="https://github.com/komo21022102/aiadtext/tree/feature/genie-style" class="btn" style="background:#666;">檢視 Genie 風格</a>
</div>
</div>
</div>

<footer>© 2026 左右大腦對決 AI 實戰教育訓練</footer>
</body>
</html>
